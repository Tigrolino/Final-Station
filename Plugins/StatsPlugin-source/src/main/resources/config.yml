# StatsPlugin settings. Apply changes with /stats reload.
afk:
  enabled: true

  timeout-seconds: 60

  now-afk-message: "&7You're now AFK"
  no-longer-afk-message: "&7You're no longer AFK"

recording:
  enabled: true
  now-recording-message: "&cRecording indicator turned on"
  no-longer-recording-message: "&7Recording indicator turned off"

live:
  enabled: true
  now-live-message: "&dLive indicator turned on"
  no-longer-live-message: "&7Live indicator turned off"

cache:
  stats-refresh-seconds: 30

  head-cache-clear-hours: 1

leaderboard:
  items-per-page: 45

