# Optional hat-placement config for PlaceableDecor (also compatible with PikminDecor 1.0.3+).
# Includes the Pikmin and named resource-pack hats; use /placeabledecor reload after editing.
config-version: 2
defaults:
  scale: 1.0
  offset-y: 0.5
  yaw-offset: 0.0
  hitbox-width: 0.45
  hitbox-height: 0.8

# Match material + item-model, with optional exact top-level custom_data string.
# To add a variant, add its model to the resource pack and declare another entry here.
variants:
  blue_bud:
    material: FLINT
    item-model: seedling:pikmin/blue_bud
    custom-data-key: seedling_pikmin
    custom-data-value: blue_bud
