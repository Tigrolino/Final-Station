name: SpawnGuard
version: '1.3'
main: com.finalstation.spawnguard.SpawnGuard
api-version: '1.21'
author: Tigrolino
description: Stops vines from growing, stops enderman and creeper griefing, and protects the spawn region.

commands:
  spawnguard:
    description: Reload the SpawnGuard config
    usage: /spawnguard reload
    permission: spawnguard.reload

permissions:
  spawnguard.reload:
    description: Allows reloading config.yml with /spawnguard reload
    default: op
