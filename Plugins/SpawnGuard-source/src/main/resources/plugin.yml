name: SpawnGuard
version: '1.4'
main: com.finalstation.spawnguard.SpawnGuard
api-version: '1.21'
author: Tigrolino
description: Protects spawn, leads and blocks from mob damage, and controls vine growth.

commands:
  spawnguard:
    description: Reload the SpawnGuard config
    usage: /spawnguard reload
    permission: spawnguard.reload

permissions:
  spawnguard.reload:
    description: Allows reloading config.yml with /spawnguard reload
    default: op
